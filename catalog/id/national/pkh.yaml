id: pkh
title: { id: "PKH: bantuan tunai", en: "PKH: family cash aid" }
benefit:
  id: Uang tunai rutin untuk ibu hamil, balita, anak sekolah, dan lansia
  en: Regular cash for pregnant women, young children, students, the elderly
why:
  id: Keluarga kurang mampu dengan ibu hamil, balita, anak sekolah, lansia, atau penyandang disabilitas berat.
  en: A low-income family with a pregnant woman, young child, school child, elderly member, or member with a severe disability.
priority: 90
eligibility:
  all:
    - any:
        - { fact: registry, in: ["yes"] }
        - { fact: income, in: [lt1, 1to2] }
    - any:
        - { fact: pregnant_toddler, in: ["yes"] }
        - { fact: school_child, in: ["yes"] }
        - { fact: elderly, in: ["yes"] }
        - { fact: disability, in: ["yes"] }
how_to_apply:
  in_person:
    office: kelurahan
    bring:
      id: [KTP, Kartu Keluarga (KK)]
      en: [ID card (KTP), Family card (Kartu Keluarga / KK)]
    steps:
      id:
        - Bilang ke petugas, "Saya ingin diusulkan masuk data DTSEN untuk bantuan PKH."
        - Isi formulir yang diberikan. Minta tolong petugas jika sulit.
        - Tunggu petugas datang ke rumah untuk mengecek.
        - Jika disetujui Kemensos, bantuan diambil lewat bank pemerintah atau Kantor Pos.
      en:
        - Tell the officer, "Saya ingin diusulkan masuk data DTSEN untuk bantuan PKH" (I would like to be proposed for the DTSEN data for PKH aid).
        - Fill in the form you are given. Ask the officer for help if it is difficult.
        - Wait for an officer to visit your home to check.
        - If the Ministry of Social Affairs approves, the aid is collected through a state bank or the post office.
    cost: { id: Gratis, en: Free }
    time:
      id: Bisa beberapa bulan, karena data dicek dulu
      en: Can take several months, because the data is checked first
  online:
    url: https://cekbansos.kemensos.go.id
    ready:
      id: [KTP (untuk nama lengkap dan alamat)]
      en: [ID card (KTP), for your full name and address]
    steps:
      id:
        - Buka situs di atas.
        - Pilih provinsi, kota/kabupaten, kecamatan, dan kelurahan sesuai KTP.
        - Ketik nama lengkap sesuai KTP, lalu tekan Cari Data.
        - Jika nama belum ada, pasang aplikasi Cek Bansos dan pakai menu Daftar Usulan, atau datang ke kelurahan.
      en:
        - Open the website above.
        - Choose the province, city/regency, district, and ward shown on your KTP.
        - Type your full name as on your KTP, then press Cari Data.
        - If your name is not there, install the Cek Bansos app and use the Daftar Usulan menu, or go to your ward office.
    cost: { id: Gratis, en: Free }
note:
  id: PKH tidak punya pendaftaran langsung. Anda diusulkan dulu, lalu Kemensos yang menetapkan penerimanya.
  en: PKH has no direct sign-up. You are proposed first, then the Ministry of Social Affairs decides who receives it.
source_url: https://cekbansos.kemensos.go.id
