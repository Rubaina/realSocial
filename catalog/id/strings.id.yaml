welcome: |-
  Selamat datang di {operator}, layanan yang mengutamakan warga untuk membantu Anda memahami dokumen dan aturan kebijakan yang rumit, dan mendapatkan dukungan yang Anda perlukan untuk memakai layanan yang tersedia bagi Anda. 👋

  Saya membantu mencari bantuan pemerintah yang mungkin bisa didapat keluarga Anda di {country}, lalu menjelaskan cara mendaftarnya. {operator} bukan layanan pemerintah.

  Saya akan bertanya beberapa hal singkat tentang keluarga Anda. Jawaban hanya dipakai untuk mencari bantuan yang cocok. Ketik HAPUS DATA SAYA kapan saja untuk menghapusnya.

  Gratis. Saya tidak pernah meminta uang, PIN, kata sandi, atau foto dokumen Anda.
