# Order matters: questions are asked top to bottom, and only when the answer can still change a result.
- id: ktp_surabaya
  text: { id: "Apakah KTP Anda KTP Surabaya?", en: "Is your ID card (KTP) a Surabaya KTP?" }
  options:
    - { value: "yes", label: { id: Ya, en: "Yes" } }
    - { value: "no", label: { id: Tidak, en: "No" } }
- id: registry
  text:
    id: Apakah keluarga Anda terdaftar di data bantuan sosial pemerintah (DTSEN/DTKS), atau pernah menerima bansos?
    en: Is your family listed in the government social aid data (DTSEN/DTKS), or has it ever received social aid (bansos)?
  options:
    - { value: "yes", label: { id: Ya, en: "Yes" } }
    - { value: "no", label: { id: Tidak, en: "No" } }
    - { value: unknown, label: { id: Tidak tahu, en: Don't know } }
- id: income
  text:
    id: Kira-kira berapa penghasilan seluruh keluarga dalam sebulan?
    en: About how much does your whole family earn in a month?
  options:
    - { value: lt1, label: { id: Di bawah Rp1 juta, en: Under Rp1 million } }
    - { value: 1to2, label: { id: "Rp1 - 2,5 juta", en: Rp1 - 2.5 million } }
    - { value: 2to4, label: { id: "Rp2,5 - 4 juta", en: Rp2.5 - 4 million } }
    - { value: gt4, label: { id: Di atas Rp4 juta, en: Over Rp4 million } }
- id: school_child
  text:
    id: Ada anak yang masih sekolah (TK, SD, SMP, SMA, atau SMK)?
    en: Is there a child still in school (kindergarten up to senior high or vocational school)?
  options:
    - { value: "yes", label: { id: Ada, en: "Yes" } }
    - { value: "no", label: { id: Tidak ada, en: "No" } }
- id: college_bound
  text:
    id: Ada anak kelas 12 atau lulusan SMA/SMK (3 tahun terakhir) yang ingin kuliah?
    en: Is there a child in grade 12, or who finished senior high school in the last 3 years, who wants to go to university?
  options:
    - { value: "yes", label: { id: Ada, en: "Yes" } }
    - { value: "no", label: { id: Tidak ada, en: "No" } }
- id: pregnant_toddler
  text:
    id: Ada ibu hamil atau anak di bawah 6 tahun di keluarga Anda?
    en: Is there a pregnant woman or a child under 6 in your family?
  options:
    - { value: "yes", label: { id: Ada, en: "Yes" } }
    - { value: "no", label: { id: Tidak ada, en: "No" } }
- id: elderly
  text:
    id: Ada anggota keluarga berusia 60 tahun ke atas?
    en: Is there a family member aged 60 or older?
  options:
    - { value: "yes", label: { id: Ada, en: "Yes" } }
    - { value: "no", label: { id: Tidak ada, en: "No" } }
- id: disability
  text:
    id: Ada anggota keluarga penyandang disabilitas berat?
    en: Is there a family member with a severe disability?
  options:
    - { value: "yes", label: { id: Ada, en: "Yes" } }
    - { value: "no", label: { id: Tidak ada, en: "No" } }
- id: bpjs
  text:
    id: Apakah keluarga Anda punya BPJS Kesehatan yang masih aktif?
    en: Does your family have active BPJS Kesehatan health insurance?
  options:
    - { value: "yes", label: { id: Punya, en: "Yes" } }
    - { value: "no", label: { id: Tidak punya, en: "No" } }
    - { value: unknown, label: { id: Tidak tahu, en: Don't know } }
- id: power
  text:
    id: Berapa daya listrik di rumah Anda?
    en: What is the electricity capacity of your home?
  options:
    - { value: "450", label: 450 VA }
    - { value: "900", label: 900 VA }
    - { value: "1300", label: { id: 1300 VA atau lebih, en: 1300 VA or more } }
    - { value: unknown, label: { id: Tidak tahu/menumpang, en: Don't know / shared } }
- id: work
  text:
    id: Apa pekerjaan utama pencari nafkah di keluarga?
    en: What is the main work of the family's breadwinner?
  options:
    - { value: informal, label: { id: Pekerja lepas/pedagang, en: Freelance / trader } }
    - { value: employee, label: { id: Karyawan bergaji tetap, en: Salaried employee } }
    - { value: none, label: { id: Tidak bekerja, en: Not working } }
