welcome: |-
  Welcome to {operator}, a people-first tool to navigate the complexity of policy documents and rules and get you the support you need to avail the services available to you. 👋

  I help you find government support your family may be able to get in {country}, and explain how to apply. {operator} is not a government service.

  I will ask a few short questions about your family. Your answers are used only to find matching support. Type DELETE MY DATA at any time to erase them.

  This is free. I never ask for money, PINs, passwords, or photos of your documents.
